[workspace]
resolver = "2"
members = [
    "dxil-spirv",
    "dxil-spirv-sys",
    "dxil-spirv-tests",
]

[workspace.package]
# Semver build metadata carries the vendored upstream dxil-spirv C API version
# (DXIL_SPV_API_VERSION_*). crates.io accepts and ignores the `+...` suffix.
version = "0.1.0+dxil-spirv.2.72.1"
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ChahuProject/dxil-spirv-rs"
homepage = "https://github.com/ChahuProject/dxil-spirv-rs"
keywords = ["dxil", "spirv", "d3d12", "shader", "decompile"]
categories = ["graphics", "ffi", "parser"]

[profile.release]
lto = true
codegen-units = 1
