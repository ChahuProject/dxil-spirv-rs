name: CI

on:
  # Direct pushes to main: skip the entire workflow for documentation-only
  # changes. CI only matters when Rust code or CI config itself changed.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.agents/**'
      - 'LICENSE-*'
  # Pull requests: do NOT use paths-ignore here. If every job were skipped by
  # path filters, required checks would stay stuck in "pending" forever (a
  # known GitHub limitation). Instead the always-run `paths` job below detects
  # which paths changed, and the heavy jobs skip themselves explicitly —
  # leaving `paths` itself as the green, mergeable check.
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Share one Cargo home across steps and enable incremental-friendly caching.
  CARGO_INCREMENTAL: 0

jobs:
  # Path detection (always runs, <15s). Decides whether the Rust jobs below
  # need to run at all. For PRs this is the always-green check that prevents
  # the "pending forever" problem when a PR only touches docs.
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'dxil-spirv/**'
              - 'dxil-spirv-sys/**'
              - 'dxil-spirv-tests/**'
              # CI config itself: a workflow change must always be validated.
              - '.github/workflows/**'

  # Fast gate: formatting. Skipped for doc-only changes (nothing to format).
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: paths
    if: needs.paths.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Lint gate: clippy only needs `cargo check`-level artifacts, so it runs
  # without the full C++ build cost being duplicated in the test job.
  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: paths
    if: needs.paths.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libclang-dev clang

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja llvm

      - name: Cache cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-clippy-crates-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-crates-

      # NOTE: we intentionally do NOT cache `target/` here. The C++ static
      # libraries are produced by CMake under target/debug/build/dxil-spirv-sys-*/
      # and are not tracked by Cargo's fingerprinting, so a restored target dir
      # can contain stale Rust .rlibs that reference C++ libraries which are
      # absent or at a different path — producing "unable to find library
      # -ldxbc-spirv" link errors. Building fresh is slower but correct.

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Full build + test. This is the only job that pays the C++ (CMake) build
  # cost, and it caches the target directory aggressively so repeat runs on
  # an unchanged Cargo.lock reuse the compiled dxil-spirv static library.
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: paths
    if: needs.paths.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libclang-dev clang

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja llvm

      - name: Cache cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-build-crates-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-crates-

      # We do NOT cache `target/` (see clippy job): the CMake-produced C++
      # static libraries under target/.../dxil-spirv-sys-*/out are invisible to
      # Cargo's fingerprinting, so a restored target/ links against missing or
      # relocated C++ archives. Building fresh keeps the link step correct.

      # Build and test in one invocation's target dir so the C++ library and
      # Rust deps are compiled once. --workspace --all-targets covers lib,
      # bins, tests and examples without a second compile pass.
      - name: Build
        run: cargo build --workspace --all-targets --verbose

      - name: Test
        run: cargo test --workspace --verbose
